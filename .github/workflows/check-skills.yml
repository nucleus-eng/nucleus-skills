name: check-skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skill frontmatter and links
        run: python3 scripts/check-skills.py
