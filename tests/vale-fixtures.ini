# A TEST-ONLY VALE CONFIG, and it exists so this repo still has no `.vale.ini`.
#
# Q6 ruled that nucleus-skills gets no `.vale.ini`: it is where the rules are AUTHORED,
# and a repo that lints itself with its own draft rules cannot tell a rule's bug from a
# prose error. That ruling stands. tests/conftest.py passes this file with `--config`,
# so nothing outside the fixtures ever sees it.
#
# StylesPath IS RELATIVE TO THIS FILE, not to the working directory. Vale says so
# plainly when it is wrong -- "The StylesPath '.../tests/plugins/...' doesn't exist" --
# and that message is the only reason it took one attempt rather than several.
#
# THE DIRECTORY UNDER StylesPath IS THE STYLE NAME. The 14 rules sit in `vale/nucleus/`
# rather than directly in `vale/` because the fixtures annotate
# `nucleus.chemical-notation`. Pointing one level up made every rule resolve as
# `vale.<name>`, which no annotation matches, and the failure mode was finding NOTHING
# rather than finding the wrong thing.
StylesPath = ../plugins/nucleus/references/vale
MinAlertLevel = suggestion

[*.md]
# `BasedOnStyles` IS WHAT TURNS THE STYLE ON. Without it Vale loads the directory and
# applies no rule, and reports a clean file. 90 of 191 cases failed that way before this
# line existed, every one of them by finding nothing.
BasedOnStyles = nucleus

# SEVERITY IS SET HERE AND NOWHERE ELSE, which is UQ1 applied to the harness: no rule
# file carries a `level:` line any more, so the consuming repo chooses. For the fixtures
# the choice does not matter -- the test asserts WHICH rules fire, not at what severity
# -- so every rule is `error` and `MinAlertLevel = suggestion` keeps nothing hidden.
nucleus.chemical-notation = error
nucleus.degrees-symbol = error
nucleus.house-casing = error
nucleus.ion-charges = error
nucleus.magnitude-unit-spacing = error
nucleus.micro-symbol = error
nucleus.mixture-plus-spacing = error
nucleus.range-style = error
nucleus.space-before-degree = error
nucleus.space-before-percent = error
nucleus.thousands-separator = error
nucleus.time-abbreviations = error
nucleus.time-si-substitution = error
nucleus.unit-spacing = error
nucleus.units = error
